# Ingress-Proxy fuer UniFi Toolkit.
# Die App kennt keinen Base-Path und nutzt absolute Pfade ("/stalker/...", "/static/...").
# Unter Ingress laeuft sie aber unter /api/hassio_ingress/<token>/, deshalb schreibt
# nginx diese Pfade in HTML, JS und CSS auf den X-Ingress-Path um.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    access_log off;
    client_max_body_size 20m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8099;
        # sonst baut nginx aus dem umgeschriebenen Location-Header wieder eine
        # absolute URL mit Port 8099, die der Browser nicht erreicht
        absolute_redirect off;
        allow 172.30.32.2;
        deny all;

        # Uebersetzung (eigene Dateien, nicht Teil der Upstream-App)
        location /__ha_i18n/ {
            alias /etc/nginx/ha-i18n/;
            add_header Cache-Control "no-cache";
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            # localhost besteht den Anti-Rebinding-Check der App
            proxy_set_header Host localhost;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # sub_filter braucht unkomprimierte Antworten
            proxy_set_header Accept-Encoding "";
            proxy_read_timeout 1h;
            proxy_buffering off;

            proxy_redirect ~^(?:https?://[^/]+)?/(.*)$ $http_x_ingress_path/$1;

            sub_filter_once off;

            # Uebersetzungsskript in jede HTML-Seite einhaengen
            sub_filter '</head>' '<script src="$http_x_ingress_path/__ha_i18n/config.js"></script><script src="$http_x_ingress_path/__ha_i18n/de.js"></script><script src="$http_x_ingress_path/__ha_i18n/i18n.js"></script></head>';
            sub_filter_types text/javascript application/javascript text/css;

            # WebSockets: `${protocol}//${window.location.host}/pulse/ws`
            sub_filter 'window.location.host}' 'window.location.host}$http_x_ingress_path';
            # "Zurueck zum Dashboard"
            sub_filter 'href="/"' 'href="$http_x_ingress_path/"';
            sub_filter '"/api' '"$http_x_ingress_path/api';
            sub_filter "'/api" "'$http_x_ingress_path/api";
            sub_filter '`/api' '`$http_x_ingress_path/api';
            sub_filter '"/static' '"$http_x_ingress_path/static';
            sub_filter "'/static" "'$http_x_ingress_path/static";
            sub_filter '`/static' '`$http_x_ingress_path/static';
            sub_filter '"/stalker' '"$http_x_ingress_path/stalker';
            sub_filter "'/stalker" "'$http_x_ingress_path/stalker";
            sub_filter '`/stalker' '`$http_x_ingress_path/stalker';
            sub_filter '"/threats' '"$http_x_ingress_path/threats';
            sub_filter "'/threats" "'$http_x_ingress_path/threats";
            sub_filter '`/threats' '`$http_x_ingress_path/threats';
            sub_filter '"/pulse' '"$http_x_ingress_path/pulse';
            sub_filter "'/pulse" "'$http_x_ingress_path/pulse";
            sub_filter '`/pulse' '`$http_x_ingress_path/pulse';
            sub_filter '"/arrest' '"$http_x_ingress_path/arrest';
            sub_filter "'/arrest" "'$http_x_ingress_path/arrest";
            sub_filter '`/arrest' '`$http_x_ingress_path/arrest';
            sub_filter '"/login' '"$http_x_ingress_path/login';
            sub_filter "'/login" "'$http_x_ingress_path/login";
            sub_filter '`/login' '`$http_x_ingress_path/login';
            sub_filter '"/logout' '"$http_x_ingress_path/logout';
            sub_filter "'/logout" "'$http_x_ingress_path/logout";
            sub_filter '`/logout' '`$http_x_ingress_path/logout';
            sub_filter '"/health' '"$http_x_ingress_path/health';
            sub_filter "'/health" "'$http_x_ingress_path/health";
            sub_filter '`/health' '`$http_x_ingress_path/health';
            sub_filter '"/rogue-support' '"$http_x_ingress_path/rogue-support';
            sub_filter "'/rogue-support" "'$http_x_ingress_path/rogue-support";
            sub_filter '`/rogue-support' '`$http_x_ingress_path/rogue-support';
        }
    }
}
